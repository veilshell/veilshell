# Optional Omarchy + Hyprland drop-in snippet for VeilShell
# Source this from ~/.config/hypr/hyprland.conf (never modify /usr/share/omarchy/).
#
# Example:
#   source = /path/to/veilshell/adapters/omarchy/veilshell.conf

# Keep VeilShell surfaces crisp without unintended Hyprland animations fighting spring physics
layerrule = noanim, veilshell

# Start VeilShell bottom pill on session start (auto-detects Omarchy Aether theme)
exec-once = veilshell --scene pill
