# Optional Legacy Hyprland (.conf) Drop-In Snippet for VeilShell
# For Omarchy 4.5+ (Lua Hyprland), use adapters/omarchy/veilshell.lua instead.
# Never modify /usr/share/omarchy/; source this from ~/.config/hypr/hyprland.conf.
#
# Example:
#   source = /path/to/veilshell/adapters/omarchy/veilshell.conf

# Keep VeilShell surfaces crisp without compositor fade animations fighting spring physics
layerrule = noanim, veilshell

# Start VeilShell bottom pill on session start (auto-detects Omarchy Aether theme)
exec-once = veilshell --scene pill

# Optional quick keybindings for the running daemon:
# bind = SUPER SHIFT, T, exec, veilctl mode toggle
# bind = SUPER SHIFT, H, exec, veilctl show home
# bind = SUPER SHIFT, R, exec, veilctl show recents
# bind = SUPER SHIFT, Q, exec, veilctl show shade
