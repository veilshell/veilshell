# Interim password locker. Do not use a screenshot of the user's windows.
general {
    grace = 0
}

background {
    monitor =
    color = rgb(0f1115)
}

label {
    monitor =
    text = $TIME
    color = rgb(f4eff4)
    font_family = Sans
    font_size = 80
    position = 0, -90
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(cac4d0)
    font_family = Sans
    font_size = 20
    position = 0, -190
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 1
    outer_color = rgb(d0bcff)
    inner_color = rgb(14171d)
    font_color = rgb(f4eff4)
    fail_color = rgb(ff6b6b)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -42
    halign = center
    valign = center
}
