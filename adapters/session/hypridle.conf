general {
    lock_cmd = veilshell-session --lock
    before_sleep_cmd = veilshell-session --lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    # Release the logind sleep delay on compositor lock notification. Logind
    # imposes its own maximum delay; this is not a fail-closed sleep policy.
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = veilshell-session --lock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
