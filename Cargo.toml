[workspace]
resolver = "2"
members = [
    "crates/veilshell-core",
    "crates/veilshell-compositor",
    "crates/veilshell-hw",
    "crates/veilshell-theme",
    "crates/veilshell-wayland",
    "crates/veilshell-render",
    "crates/veilshell-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
repository = "https://github.com/veilshell/veilshell"
homepage = "https://github.com/veilshell/veilshell"
authors = ["VeilShell Contributors"]
keywords = ["wayland", "tablet", "touch", "shell", "hyprland"]
categories = ["gui", "os::linux-apis"]

[workspace.dependencies]
veilshell-core = { path = "crates/veilshell-core" }
veilshell-compositor = { path = "crates/veilshell-compositor" }
veilshell-hw = { path = "crates/veilshell-hw" }
veilshell-theme = { path = "crates/veilshell-theme" }
veilshell-wayland = { path = "crates/veilshell-wayland" }
veilshell-render = { path = "crates/veilshell-render" }
bytemuck = { version = "1.25", features = ["derive"] }
png = "0.18"
pollster = "1.0"
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = { version = "0.31", features = ["system"] }
wgpu = { version = "26", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.veilshell-render]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "s"
