name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Unit Tests & Visual Snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install keyboard and PAM development libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libpam0g-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tier 1 — Unit tests
        run: cargo test --workspace
      - name: Standalone session launcher tests
        run: python3 scripts/test-session.py && python3 scripts/test-session-services.py
      - name: Tier 2 — Offscreen visual snapshots
        run: ./scripts/test-snapshots.sh /tmp/veilshell-ci-snapshots
      - name: Upload visual snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veilshell-visual-snapshots
          path: /tmp/veilshell-ci-snapshots/*.png
